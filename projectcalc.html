<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><center>Calculator</center></title>
</head>
<style>

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #06081b;
    }
    .calculator {
        width: 300px;
        padding: 20px;
        background-color: #010102;
        border-radius: 15px;
    }
    #display {
        width: 100%;
        height: 55px;
        box-sizing: border-box;
        margin-bottom: 15px;
        font-size: 25px;
        text-align: right;
        border-radius: 8px;
        background-color: white;
    }
    .button {
        text-align: center;
    }

    button {
        width: 60px;
        height: 50px;
        margin: 4px;
        border-radius: 8px;
        border:none;
        font-size: 18px;
        background-color: #1d1c1c;
        color: rgb(252, 252, 252);
    }

    button:hover {
        background-color: #978f8f;
    }

    .operator {
        background-color: #b8ad1a;
    }

    .clear {
        background-color: #c24435;
    }

    .anoclear {
        background-color: #392fca;
    }

    .calculate {
        background-color: #25bd64;
        width: 130px;
    }
</style>
<body>
    
    <div class="calculator">
        <input id="display" value="0"/><!--30679-->
        <div class="button">
            <button type ="submit" class="clear" onclick="cleardisplay()">Clear</button>
            <button type="submit" class="anoclear" onclick="deletelast()">Delete</button>
            <button type="submit" class="operator" onclick="appendvalue('%')">%</button>
            <button type="submit" class="operator" onclick="appendvalue('/')">/</button><br>

            <button type ="submit" class="number" onclick="appendvalue('7')">7</button>
            <button type ="submit" class="number" onclick="appendvalue('8')">8</button>
            <button type ="submit" class="number" onclick="appendvalue('9')">9</button>
            <button type ="submit" class="operator" onclick="appendvalue('*')">x</button><br>

            <button type ="submit" class="number"  onclick="appendvalue('4')">4</button>
            <button type ="submit" class="number"  onclick="appendvalue('5')">5</button>
            <button type ="submit" class="number"  onclick="appendvalue('6')">6</button>
            <button type ="submit" class="operator" onclick="appendvalue('+')">+</button><br>

            <button type ="submit" class="number"  onclick="appendvalue('1')">1</button>
            <button type ="submit" class="number"  onclick="appendvalue('2')">2</button>
            <button type ="submit" class="number"  onclick="appendvalue('3')">3</button>
            <button type ="submit" class="operator" onclick="appendvalue('-')">-</button><br>

            <button type ="submit" class="number"  onclick="appendvalue('0')">0</button>
            <button type ="submit" class="number"  onclick="appendvalue('.')">.</button>
            <button type ="submit" class="calculate" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function cleardisplay(){
            display.value="0";
        }
        function deletelast(){
            if(display.value.length===1){
                display.value="0";
            }
            else{
                display.value=display.value.slice(0,-1);
            }
        }
        function appendvalue(value){
            if(display.value==="0" && !isNaN(value)){
                display.value=value;
            }
            else{
                display.value+=value;
            }
        }
        function calculate(){
            try{
                display.value=eval(display.value);
            }
            catch(e){
                display.value="Error";
            }
        }
    </script>
</body>
</html>
