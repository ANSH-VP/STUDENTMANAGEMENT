<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Counter</title>
</head>
<style>
    #display{
        height: 5vh;
        width: 40px;
        font-size: 50px;
        color:rgb(9, 58, 29)
    }
    #counter{
            background-color:rgb(52, 185, 112);
            width:35%;
            height:45vh;
            border-radius: 9px;
        }
        button{
            height:4vh;
            width:30%;
            border-color: rgb(10, 68, 27);
            border-radius: 5px;
            color:rgb(52, 134, 89)
        }

        body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        }
        
</style>
<body style="background-color: #F0FDF4;">
    <div id="counter">
        <h1 style="color: rgb(7, 82, 36); font-family:Trebuchet MS ,   sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
"><center>The Interactive Counter</center></h1><br>
        <div id="buttons">
             <center>
            <div id="display"></div>
        </center><br><br><br>
            <center><button type="submit" id="no9+pe" onclick="decrease()"><b>-1</b></button>
            <button type ="submit" class="nope" onclick="cleardisplay()"><b>Clear</b></button>
            <button type ="submit" class="nope" onclick="increase()"><b>+1</b></button></center>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');

        function cleardisplay() {
            display.textContent = "";
        }

        function decrease() {
            display.textContent = Number(display.textContent) - 1;
        }

        function increase() {
            display.textContent = Number(display.textContent) + 1;
        }
    </script>
    
</body>
</html>
