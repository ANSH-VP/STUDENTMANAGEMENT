<!DOCTYPE html>
<html>
    <head>
        <title>The Login Form</title>
    </head>
    <style>
        #box{
            padding-inline: 3%;
            padding-block:3%;
            border:20px solid aquamarine;
            background-color: azure;
            width:30%;
            height:40vh;
            border-radius: 8px;
        }
        .error{ 
            text-align: center;
            color:rgb(212, 28, 28);
            position:relative;
            left: 180px;
        }
        button{
            height:4vh;
            width:30%;
        }
        h1{
            margin-top: 0;
            position:relative;
            top: -20px;
        }
        body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        }

    </style>
    <body>
        <div id="box">
            <h1><center>Login</center></h1>
            <form class="login" onsubmit="return validateForm()">
                <p><b>Email:</b></p>
                <input type="text" id ="email"placeholder="Enter your username"/><br>
                <span id="emailError" class="error"></span><br>
                <p><b>Password:</b></p> 
                <input type="password" id="pass" placeholder="Enter your password"/><br>
                <span id="passError" class="error"></span><br><br><br>`
                <center><button type="Sumbit" onclick=""><b>Login</b></button></center>
            </form>
        </div>
        <SCRIPT>
            function validateForm(){
            let email=document.getElementById("email").value;
            let pass=document.getElementById("pass").value;
            let emailerror=document.getElementById("emailerror");
            let passError = document.getElementById("passError");
            if (email===""){
                emailError.innerHTML="please enter email id";
                valid=false;
            }
            else if(!email.includes("@")){
                emailError.innerHTML="please enter a valid Email id";
                valid=false;
            }
            else if(pass===""){
                passError.innerHTML="please enter password";
                valid=false;
            }
            else if(pass.length<8){
                passError.innerHTML="please enter 8 character password";
                valid=false;
            }
            else if(!pass.match(/[0-9]/)){
                passError.innerHTML="password should contain atleast one number";
                valid=false;
            }
            else{
                alert("Login successfully");
                valid=true;
            }
            return valid;
        }
        </SCRIPT>
    </body>
</html>
